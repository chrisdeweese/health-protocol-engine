name: Feature Request
description: Propose an engine, developer API, tooling, or documentation improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests should keep the project in the research/developer toolkit lane.

        This project does not diagnose, prescribe, replace clinician review, or provide medical advice.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What developer or research workflow is blocked or awkward?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the API, CLI, docs, data model, validation, or tooling change.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Public API
        - CLI
        - Schemas/types
        - Safety validation signals
        - Catalog tooling
        - Documentation
        - Examples
        - CI/release tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What workarounds or alternate designs have you considered?
  - type: textarea
    id: safety
    attributes:
      label: Safety Boundary Impact
      description: Explain how this stays outside medical advice and what disclaimers, review flags, or production controls would be needed downstream.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This is not a request for diagnosis, treatment, dosing, or individual health guidance.
          required: true
        - label: I have removed personal health information.
          required: true
